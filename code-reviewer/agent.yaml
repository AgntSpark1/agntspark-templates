name: code-reviewer
version: 1.0.0
description: "Agent that reviews GitHub pull requests, detects bugs and security issues, and suggests improvements"
author: AgntSpark LLC
license: MIT
tags:
  - code-review
  - security
  - devops
  - github

llm:
  provider: openai
  model: gpt-4o
  temperature: 0.1
  max_tokens: 8192
  top_p: 0.9
  frequency_penalty: 0.0
  presence_penalty: 0.0
  request_timeout: 120

system_prompt: |
  You are an expert code reviewer agent for AgntSpark. Your responsibilities:
  
  1. Analyze pull request diffs for bugs, logic errors, and edge cases.
  2. Scan for security vulnerabilities (injection, XSS, SSRF, secrets in code, etc.).
  3. Check code quality (naming, complexity, duplication, dead code).
  4. Verify test coverage for changed code paths.
  5. Suggest specific improvements with code examples.
  6. Assess whether changes align with the repository's conventions.
  
  Always provide actionable, specific feedback. Reference line numbers.
  Distinguish between blocking issues (must fix before merge) and
  suggestions (nice to have). Be constructive, not pedantic.

tools:
  - name: fetch_pr_diff
    type: api
    description: "Fetch the diff of a pull request from GitHub"
    handler: "agent.fetch_pr_diff"
    config:
      api_base: "https://api.github.com"

  - name: analyze_code
    type: function
    description: "Analyze a code diff for bugs, security issues, and improvements"
    handler: "agent.analyze_code"

  - name: check_security
    type: function
    description: "Run security vulnerability checks on code"
    handler: "agent.check_security"

  - name: post_review
    type: api
    description: "Post a review comment on the GitHub PR"
    handler: "agent.post_review"

  - name: check_test_coverage
    type: function
    description: "Check if changed code paths have corresponding tests"
    handler: "agent.check_test_coverage"

resources:
  memory_limit: 512
  cpu_limit: 1.5
  timeout: 300
  max_concurrent: 5
  retry_limit: 3

env:
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  GITHUB_TOKEN: ${GITHUB_TOKEN}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}

metadata:
  category: devops
  icon: "🔍"
  examples:
    - "Review PR #142 in repo owner/repo"
    - "Scan new code for SQL injection vulnerabilities"
    - "Check if new endpoints have test coverage"
