name: customer-support
version: 1.0.0
description: "AI customer support agent with knowledge base lookup, intelligent ticket routing, and real-time sentiment analysis"
author: AgntSpark LLC
license: MIT
tags:
  - support
  - customer-service
  - nlp
  - routing

llm:
  provider: openai
  model: gpt-4o
  temperature: 0.3
  max_tokens: 4096
  top_p: 0.9
  frequency_penalty: 0.2
  presence_penalty: 0.1
  request_timeout: 60

system_prompt: |
  You are an expert customer support agent for AgntSpark. Your role is to:
  
  1. Greet customers warmly and professionally.
  2. Search the knowledge base for relevant answers before responding.
  3. Analyze customer sentiment and adjust your tone accordingly.
  4. Route complex or escalated issues to the appropriate human team.
  5. Always cite the knowledge base article ID when referencing documentation.
  6. Never make up answers—if the knowledge base doesn't cover it, escalate.
  7. Track conversation context and reference previous messages naturally.
  8. Summarize the resolution at the end of each interaction.
  
  You have access to a knowledge base, ticketing system, and sentiment analysis tool.
  Use them proactively. When a customer is frustrated, acknowledge their emotion
  before providing a solution.

tools:
  - name: search_knowledge_base
    type: function
    description: "Search the internal knowledge base for articles matching a query"
    handler: "agent.search_knowledge_base"
    config:
      max_results: 5
      min_relevance: 0.7

  - name: create_ticket
    type: function
    description: "Create a support ticket in the ticketing system"
    handler: "agent.create_ticket"

  - name: route_ticket
    type: function
    description: "Route a ticket to the appropriate team based on category"
    handler: "agent.route_ticket"
    config:
      teams:
        - technical
        - billing
        - account
        - product
        - general

  - name: analyze_sentiment
    type: function
    description: "Analyze customer message sentiment (positive, neutral, negative, frustrated)"
    handler: "agent.analyze_sentiment"

  - name: get_customer_history
    type: function
    description: "Retrieve customer interaction history"
    handler: "agent.get_customer_history"

resources:
  memory_limit: 512
  cpu_limit: 1.0
  timeout: 300
  max_concurrent: 10
  retry_limit: 3

env:
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  KNOWLEDGE_BASE_URL: ${KNOWLEDGE_BASE_URL}
  KNOWLEDGE_BASE_API_KEY: ${KNOWLEDGE_BASE_API_KEY}
  TICKETING_SYSTEM_URL: ${TICKETING_SYSTEM_URL}
  TICKETING_API_KEY: ${TICKETING_API_KEY}
  CUSTOMER_DB_URL: ${CUSTOMER_DB_URL}

metadata:
  category: customer-support
  icon: "🎧"
  examples:
    - "Customer asks about billing discrepancy"
    - "Technical troubleshooting for API errors"
    - "Account access recovery"
