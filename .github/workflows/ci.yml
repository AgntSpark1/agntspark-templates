name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "agntspark-core[server] @ git+https://github.com/AgntSpark1/agntspark-core.git@main" \
            jsonschema==4.23.0 pyyaml==6.0.2 pytest==8.3.3 ruff

      - name: Lint
        run: ruff check templates tests

      - name: Test
        run: pytest -q

  images:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the agent runtime image
        run: |
          git clone --depth 1 https://github.com/AgntSpark1/agntspark-core.git /tmp/agntspark-core
          docker build -t agntspark/agent-runtime:latest /tmp/agntspark-core

      - name: Build every template image
        run: |
          for dir in templates/*/; do
            name=$(basename "$dir")
            docker build --build-arg TEMPLATE="$name" -t "agntspark/template-$name:ci" .
          done
