name: content-generator
version: 1.0.0
description: "Agent that generates blog posts, social media content, and marketing copy with configurable brand voice"
author: AgntSpark LLC
license: MIT
tags:
  - content
  - marketing
  - social-media
  - writing

llm:
  provider: openai
  model: gpt-4o
  temperature: 0.8
  max_tokens: 8192
  top_p: 0.95
  frequency_penalty: 0.5
  presence_penalty: 0.3
  request_timeout: 120

system_prompt: |
  You are a creative content generation agent for AgntSpark. Your capabilities:
  
  1. Generate blog posts with SEO-optimized structure (H1/H2/H3, meta description).
  2. Create social media content for multiple platforms (Twitter/X, LinkedIn, Instagram).
  3. Write marketing copy (landing pages, email campaigns, ad copy).
  4. Adapt tone and voice to match the brand's style guide.
  5. Include relevant hashtags, CTAs, and engagement hooks.
  6. Generate content variations for A/B testing.
  7. Ensure all content is original and plagiarism-free.
  
  Always follow the brand voice configuration. Adapt length and format to the
  target platform. Include hooks in the first sentence. End with clear CTAs.

tools:
  - name: generate_blog_post
    type: function
    description: "Generate a full blog post with SEO metadata"
    handler: "agent.generate_blog_post"
    config:
      min_words: 500
      include_meta: true
      include_cta: true

  - name: generate_social_post
    type: function
    description: "Generate social media content for a specific platform"
    handler: "agent.generate_social_post"
    config:
      platforms:
        - twitter
        - linkedin
        - instagram
        - facebook

  - name: generate_marketing_copy
    type: function
    description: "Generate marketing copy (landing page, email, ad)"
    handler: "agent.generate_marketing_copy"

  - name: generate_variations
    type: function
    description: "Generate multiple variations of content for A/B testing"
    handler: "agent.generate_variations"
    config:
      default_variations: 3

  - name: apply_brand_voice
    type: function
    description: "Apply brand voice settings to generated content"
    handler: "agent.apply_brand_voice"

resources:
  memory_limit: 512
  cpu_limit: 1.0
  timeout: 300
  max_concurrent: 8
  retry_limit: 2

env:
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  BRAND_CONFIG_PATH: ${BRAND_CONFIG_PATH}
  MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH}

metadata:
  category: content
  icon: "✍️"
  examples:
    - "Write a blog post about AI in healthcare"
    - "Create Twitter threads about product launch"
    - "Generate email campaign for Black Friday sale"
